name: Build & Release

on:
  push:
    tags:
      - 'v*'          # مثال: v1.0.1
  workflow_dispatch:  # تشغيل يدوي من تبويب Actions عند الحاجة

permissions:
  contents: write     # مطلوب لإنشاء Release ورفع الملفات

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run dist

      - name: List build output
        run: Get-ChildItem dist | Select-Object Name, Length
        shell: pwsh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RestoPrime ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
