name: Build & Release

on:
  push:
    tags:
      - 'v*'          # مثال: v1.0.1
  workflow_dispatch:  # تشغيل يدوي من تبويب Actions عند الحاجة

permissions:
  contents: write     # مطلوب لإنشاء Release ورفع الملفات

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer and publish to GitHub Releases
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
