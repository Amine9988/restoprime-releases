<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RestoPrime — تسيير المطعم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">🍽️</div>
        <div>
          <div class="brand-name" id="brand-name">RestoPrime</div>
          <div class="brand-sub">نظام تسيير المطعم</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main>
      <header class="topbar">
        <h1 id="page-title"></h1>
        <div class="topbar-left">
          <button class="btn primary" onclick="quickNewOrder()">＋ طلب جديد</button>
          <span class="net-status on" id="trial-badge" style="display:none"></span>
          <span class="net-status" id="net-status" style="display:none"></span>
          <div class="clock" id="clock"></div>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="print-area"></div>
  <script src="app.js"></script>
</body>
</html>
